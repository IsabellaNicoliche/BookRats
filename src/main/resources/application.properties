# ============================================================
# BookRats - configuracao da aplicacao
# ============================================================
# Nenhuma credencial real deve ficar neste arquivo. A connection
# string do MongoDB Atlas e o usuario/senha do admin inicial sao
# lidos de variaveis de ambiente (veja o README para o passo a passo).
# ============================================================

spring.application.name=bookrats

server.port=${SERVER_PORT:8080}

# --------------------------------------------------------------
# MongoDB Atlas
# --------------------------------------------------------------
# Defina a variavel de ambiente MONGODB_URI com a connection string
# fornecida pelo Atlas, por exemplo:
# mongodb+srv://<usuario>:<senha>@<cluster>.mongodb.net/bookrats?retryWrites=true&w=majority
#
# Em desenvolvimento local, sem Atlas configurado, o valor padrao abaixo
# aponta para um MongoDB local (ex.: via Docker) apenas para nao quebrar
# o boot da aplicacao caso a variavel nao exista.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/bookrats}

# --------------------------------------------------------------
# Spring Session (sessoes HTTP tambem armazenadas no MongoDB)
# --------------------------------------------------------------
spring.session.store-type=mongodb
spring.session.timeout=30m
spring.session.mongodb.collection-name=sessions

# --------------------------------------------------------------
# Thymeleaf
# --------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# --------------------------------------------------------------
# Usuario administrador inicial (criado automaticamente no primeiro
# boot, somente se ainda nao existir nenhum ADMIN no banco).
# Troque a senha padrao assim que fizer o primeiro login!
# --------------------------------------------------------------
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:admin@bookrats.local}
app.admin.password=${ADMIN_PASSWORD:TrocarSenha123!}

# --------------------------------------------------------------
# Tema visual (lido pelo GlobalModelAttributes e injetado em todas
# as paginas via CSS custom properties). Troque estes valores -ou
# sobrescreva por variavel de ambiente- para aplicar um novo tema
# sem alterar HTML/CSS nem a logica de negocio.
# --------------------------------------------------------------
app.theme.name=${THEME_NAME:BookRats Lilas}
app.theme.primary-color=${THEME_PRIMARY_COLOR:#6b4ea6}
app.theme.secondary-color=${THEME_SECONDARY_COLOR:#9b7fd4}
app.theme.accent-color=${THEME_ACCENT_COLOR:#f4c95d}
app.theme.background-color=${THEME_BACKGROUND_COLOR:#f6f1fb}
app.theme.text-color=${THEME_TEXT_COLOR:#2b2240}
app.theme.logo-text=${THEME_LOGO_TEXT:BookRats}

# --------------------------------------------------------------
# Logging
# --------------------------------------------------------------
logging.level.org.springframework.security=INFO
