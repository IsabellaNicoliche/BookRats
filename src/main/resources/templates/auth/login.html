<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Login')}"></head>
<body class="auth-page">
<main class="auth-card">
    <h1 th:text="${theme.logoText}">BookRats</h1>
    <p class="subtitle">Entre com seu usuario (ou e-mail) e senha.</p>

    <p class="alert alert-success" th:if="${param.cadastroOk != null}">
        Cadastro realizado com sucesso! Faca login para continuar.
    </p>
    <p class="alert alert-info" th:if="${param.logout != null}">
        Voce saiu do sistema.
    </p>
    <p class="alert alert-error" th:if="${param.error != null}">
        Usuario/e-mail ou senha invalidos.
    </p>

    <form th:action="@{/login}" method="post" class="form">
        <label for="login">Usuario ou e-mail</label>
        <input type="text" id="login" name="login" required autofocus/>

        <label for="password">Senha</label>
        <input type="password" id="password" name="password" required/>

        <button type="submit" class="btn-primary">Entrar</button>
    </form>

    <p class="auth-footer">
        Ainda nao tem conta? <a th:href="@{/register}">Cadastre-se</a>
    </p>
</main>
</body>
</html>
