<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(title='Cadastro')}"></head>
<body class="auth-page">
<main class="auth-card">
    <h1 th:text="${theme.logoText}">BookRats</h1>
    <p class="subtitle">Crie sua conta de leitor.</p>

    <p class="alert alert-error" th:if="${erroCadastro}" th:text="${erroCadastro}"></p>

    <form th:action="@{/register}" th:object="${registerForm}" method="post" class="form">

        <label for="username">Nome de usuario</label>
        <input type="text" id="username" th:field="*{username}"/>
        <small class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></small>

        <label for="fullName">Nome completo</label>
        <input type="text" id="fullName" th:field="*{fullName}"/>
        <small class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></small>

        <label for="email">E-mail</label>
        <input type="email" id="email" th:field="*{email}"/>
        <small class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>

        <label for="password">Senha</label>
        <input type="password" id="password" th:field="*{password}"/>
        <small class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>

        <label for="confirmPassword">Confirmar senha</label>
        <input type="password" id="confirmPassword" th:field="*{confirmPassword}"/>
        <small class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></small>

        <button type="submit" class="btn-primary">Cadastrar</button>
    </form>

    <p class="auth-footer">
        Ja tem conta? <a th:href="@{/login}">Entrar</a>
    </p>
</main>
</body>
</html>
